<style>
  :root {
    --width: 720px;
    --font-main: "IBM Plex Mono", monospace;
    --font-secondary:
      -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans,
      Ubuntu, Cantarell, "Helvetica Neue", Helvetica, "游ゴシック",
      "PingFang SC", STXihei, "华文细黑", "Microsoft YaHei", "微软雅黑", SimSun,
      "宋体", Heiti, "黑体", sans-serif;
    --font-scale: 1em;
    --background-color: #fff;
    --heading-color: #222;
    --text-color: #444;
    --link-color: inherit;
    --link-underline-color: #5cee9a;
    --visited-color: inherit;
    --blockquote-color: #222;
    --border-radius: 2px;
    --iframe-filter: filter: invert(98%) sepia(1%) saturate(28%)
      hue-rotate(175deg) brightness(115%) contrast(87%);
    --transition: all 0.2s linear;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --background-color: #212121;
      --heading-color: #eee;
      --text-color: #dadada;
      --link-color: #5cee9a;
      --link-underline-color: transparent;
      --visited-color: #5cee9a;
      --blockquote-color: #ccc;
      --iframe-filter: invert(99%) sepia(10%) saturate(482%) hue-rotate(278deg)
        brightness(114%) contrast(87%);
    }
  }

  body {
    font-family: var(--font-secondary);
    font-size: var(--font-scale);
    margin: auto;
    max-width: var(--width);
    padding: 20px;
    text-align: left;
    background-color: var(--background-color);
    word-wrap: break-word;
    overflow-wrap: break-word;
    line-height: 1.4;
    color: var(--text-color);
  }

  h1,
  h2,
  h3,
  h4,
  h5,
  h6 {
    font-family: var(--font-main);
    color: var(--heading-color);
  }

  a {
    transition: var(--transition);
    color: var(--link-color);
    cursor: pointer;
    text-decoration: underline;
    text-decoration-thickness: 0.1em;
    text-decoration-color: var(--link-underline-color);
  }

  a:hover {
    text-decoration-color: var(--link-color);
    background: var(--link-underline-color) !important;
  }

  nav {
    display: flex;
    flex-wrap: wrap;
    gap: 1em;
  }

  strong,
  b {
    color: var(--heading-color);
  }

  button {
    margin: 0;
    cursor: pointer;
  }

  table {
    width: 100%;
  }

  hr {
    border: 0;
    border-top: 1px dashed;
  }

  img {
    max-width: 100%;
  }

  code {
    font-family: monospace;
    border-radius: var(--border-radius);
  }

  blockquote {
    border-left: 1px solid #999;
    color: var(--blockquote-color);
    padding-left: 20px;
    font-style: italic;
  }

  footer {
    font-family: var(--font-main);
    padding: 25px 0;
    text-align: center;
    line-height: 1;
    small {
      font-size: 0.2em;
    }
  }

  .title h1 {
    font-size: 1.5em;
  }

  .inline {
    width: auto !important;
  }

  .highlight,
  .code {
    border-radius: var(--border-radius);
    margin-block-start: 1em;
    margin-block-end: 1em;
    overflow-x: auto;
  }

  .highlight pre,
  .code pre {
    min-width: 100%;
    width: max-content;
  }

  /* blog post list */
  ul.blog-posts {
    list-style-type: none;
    padding: unset;
  }

  ul.blog-posts li {
    display: flex;
  }

  ul.blog-posts li span {
    flex: 0 0 130px;
  }

  ul.blog-posts li a:visited {
    color: var(--visited-color);
  }

  .post-meta {
    font-size: 0.8em;
  }

  time {
    font-family: var(--font-main);
  }

  p {
    text-align: justify;
  }

  .center {
    text-align: center;
  }

  /* profile/home */
  .profile {
    margin: 4em auto;
    text-align: center;
    * {
      margin: 0;
    }
    img {
      border-radius: 50%;
      width: 20em;
    }
  }

  .testimonials {
    font-size: 0.8em;

    display: grid;
    grid-auto-rows: 0;
    grid-auto-columns: 0;
    align-items: center;

    grid-template-columns: repeat(1, 1fr);
    grid-template-rows: auto auto;

    /* @media (width > 960px) {
      grid-template-rows: repeat(1, 1fr);
      grid-template-columns: auto auto;
    }
    */

    overflow: hidden;
    .entry {
      margin: auto;
      padding: 2em 0;
      max-width: calc(max-content - 2em);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.2em;

      img {
        border-radius: 50%;
        width: 5em;
      }

      .stars {
        color: gold;
      }

      p {
        text-align: justify;
      }

      * {
        max-width: 48ch;
        margin: 0;
      }
    }
  }

  /* widgets etc */
  #livestats {
    transition: var(--transition);
    opacity: 0;
    height: 1em;
    overflow: clip;
    iframe {
      filter: var(--iframe-filter);
    }
  }

  #livestats.loaded {
    opacity: 1;
    border-left: solid thick var(--link-color);
    padding-left: 0.5em;
  }

  form {
    display: inline-block;
    margin-top: 1rem;
    border-bottom: thick solid var(--link-underline-color);
    border-radius: var(--border-radius);
    * {
      appearance: none;
      outline: none;
      border: none;
      padding: 0.5em;
      margin: 0;
      border-radius: var(--border-radius);
    }
  }
</style>
