<style>
  :root {
    --main-color: #5cee9a;
    --img-filter: grayscale(100%) sepia(100%) hue-rotate(90deg);

    --width: 720px;
    --font-main: "IBM Plex Mono", monospace;
    --font-secondary:
      -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans,
      Ubuntu, Cantarell, "Helvetica Neue", Helvetica, "游ゴシック",
      "PingFang SC", STXihei, "华文细黑", "Microsoft YaHei", "微软雅黑", SimSun,
      "宋体", Heiti, "黑体", sans-serif;
    --font-scale: 1em;
    --background-color: #fff;
    --heading-color: #222;
    --text-color: #444;
    --link-color: inherit;
    --link-underline-color: var(--main-color);
    --visited-color: inherit;
    --blockquote-color: #222;
    --border-radius: 2px;
    --iframe-filter: filter: invert(98%) sepia(1%) saturate(28%)
      hue-rotate(175deg) brightness(115%) contrast(87%);
    --transition: all 0.2s linear;
    --always-green-color: var(--main-color);

    interpolate-size: allow-keywords;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --background-color: #212121;
      --heading-color: #eee;
      --text-color: #dadada;
      --link-color: var(--main-color);
      --link-underline-color: transparent;
      --visited-color: var(--main-color);
      --blockquote-color: #ccc;
      --iframe-filter: invert(99%) sepia(10%) saturate(482%) hue-rotate(278deg)
        brightness(114%) contrast(87%);
    }
  }

  body {
    font-family: var(--font-secondary);
    font-size: var(--font-scale);
    margin: auto;
    max-width: var(--width);
    padding: 1.5em;
    text-align: left;
    background-color: var(--background-color);
    word-wrap: break-word;
    overflow-wrap: break-word;
    line-height: 1.4;
    color: var(--text-color);
  }

  h1,
  h2,
  h3,
  h4,
  h5,
  h6 {
    font-family: var(--font-main);
    color: var(--heading-color);
  }

  a,
  .button {
    transition: var(--transition);
    color: var(--link-color);
    cursor: pointer;
    text-decoration: underline;
    text-decoration-thickness: 0.1em;
    text-decoration-color: var(--link-underline-color);
  }

  a:hover,
  a:target,
  .button:hover {
    text-decoration-color: var(--link-color);
    background: var(--link-underline-color) !important;
  }

  header {
    text-align: center;
  }

  nav {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0 1em;
    font-family: var(--font-main);

    border-bottom: thick solid var(--always-green-color);
  }

  strong,
  b {
    color: var(--heading-color);
  }

  button {
    margin: 0;
    cursor: pointer;
  }

  table {
    width: 100%;
  }

  hr {
    border: 0;
    border-top: 1px dashed;
  }

  img {
    max-width: 100%;
  }

  code {
    font-family: monospace;
    border-radius: var(--border-radius);
  }

  blockquote {
    border-left: 1px solid #999;
    color: var(--blockquote-color);
    padding-left: 1.5em;
    font-style: italic;
  }

  footer {
    font-family: var(--font-main);
    text-align: center;
    padding-bottom: 2em;
    line-height: 1;
    small {
      font-size: 0.75em;
      text-align: justify;
      transition: var(--transition);
    }

    .credits {
      margin-top: 1em;
    }
  }

  .title h1 {
    font-size: 1.5em;
  }

  .inline {
    width: auto !important;
  }

  .highlight,
  .code {
    border-radius: var(--border-radius);
    margin-block-start: 1em;
    margin-block-end: 1em;
    overflow-x: auto;
  }

  .highlight pre,
  .code pre {
    min-width: 100%;
    width: max-content;
  }

  /* blog post list */
  ul.blog-posts {
    list-style-type: none;
    padding: unset;
  }

  ul.blog-posts li {
    display: flex;
  }

  ul.blog-posts li span {
    flex: 0 0 130px;
  }

  ul.blog-posts li a:visited {
    color: var(--visited-color);
  }

  .post-meta {
    font-size: 0.8em;
  }

  time {
    font-family: var(--font-main);
  }

  p {
    text-align: justify;
  }

  .center {
    text-align: center;
    margin: auto;
  }

  .pseudo {
    position: relative;
    &::before {
      position: absolute;
      bottom: 2em;
      left: 0;
      display: inline-block;
      transition: var(--transition);

      font-size: 0.5em;
      content: "";
      overflow-x: hidden;
      vertical-align: middle;
      height: 0;
    }
    &:hover::before {
      content: "(pseudo-)";
      height: auto;
    }
  }

  /* profile/home */
  .profile {
    img {
      border-radius: 50%;
      width: 20em;
      aspect-ratio: 1;
      object-fit: cover;
      filter: var(--img-filter);
      image-rendering: pixelated;
    }
  }

  .sections {
    text-align: center;
    margin-top: 3em;
    display: flex;
    flex-direction: column;
    gap: 3em;
    * {
      margin: 0;
    }
  }

  #testimonials {
    margin: 1em auto;
    width: max-content;

    box-shadow: rgba(0, 0, 0, 0.35) 0 1em 3em;
    background: #88888811;
    border-radius: 1em;

    display: grid;
    grid-auto-rows: 0;
    grid-auto-columns: 0;
    align-items: center;

    grid-template-columns: 1fr;
    grid-template-rows: 1fr;

    height: auto;
    transition: all 1s linear;
    transition-behavior: allow-discrete;
    interpolate-size: allow-keywords;
    @starting-style {
      height: 0;
      opacity: 0;
    }

    overflow: hidden;
    .entry {
      margin: auto;
      padding: 1em;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.2em;

      order: round(
        mod(
            sin(var(--index) * 12.9898 + var(--seed) * 78.233) * 43758.5453,
            1
          ) *
          1000
      );

      img {
        border-radius: 50%;
        width: 5em;
        filter: var(--img-filter);
        image-rendering: pixelated;
      }

      .stars {
        color: gold;
        margin: 0.5em;
      }

      p {
        text-align: justify;
      }

      * {
        max-width: 48ch;
        margin: 0;
      }
    }
  }

  /* widgets etc */
  #livestats {
    transition: var(--transition);
    opacity: 0;
    height: 1em;
    overflow: clip;
    iframe {
      filter: var(--iframe-filter);
    }
  }

  #livestats.loaded {
    opacity: 1;
    border-left: solid thick var(--link-color);
    padding-left: 0.5em;
  }

  form {
    display: inline-block;
    margin-top: 0.5em;
    border-bottom: thick solid var(--link-underline-color);
    border-radius: var(--border-radius);
    * {
      appearance: none;
      outline: none;
      border: none;
      padding: 0.5em;
      margin: 0;
      border-radius: var(--border-radius);
    }
  }
</style>
